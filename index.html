<!DOCTYPE html>
<html>
<head>
  <title>Online Exam</title>
  <style>
    body { font-family: Arial; background: lightblue; }
    .box { width: 450px; max-width: 90%; margin: 30px auto; padding: 20px; background: white; }
    input[type=text], input[type=password] { width: 95%; padding: 8px; margin: 6px 0; }
    button { width: 100%; padding: 10px; background: blue; color: white; border: none; }
    .top { display: flex; justify-content: space-between; background: blue; color: white; padding: 8px; }
    label { display: block; }
    .hidden { display: none; }
    h1, h2 { text-align: center; }
  </style>
</head>
<body>

  <!-- PART 1: LOGIN PAGE -->
  <div id="loginPage" class="box">
    <h1>Student Login</h1>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <p id="error" style="color:red"></p>
    <button onclick="login()">Login</button>
    <p>Use: student1 / 1234</p>
  </div>

  <!-- PART 2 and 3: QUESTIONS AND TIMER -->
  <div id="examPage" class="box hidden">
    <div class="top">
      <span>Time left: <b id="timer"></b></span>
    </div>
    <div id="questions"></div>
    <button onclick="submitExam()">Submit</button>
  </div>

  <!-- PART 4: RESULT PAGE -->
  <div id="resultPage" class="box hidden">
    <h1>Result</h1>
    <h2 id="score"></h2>
    <h2 id="status"></h2>
  </div>

<script>
  // ----- Questions: q = question, options = choices, answer = correct option number (starts from 0) -----
  var questions = [
    { q: "Which language is used to create web pages?", options: ["CSS", "HTML", "Java", "SQL"], answer: 1 },
    { q: "Which language is used to style web pages?", options: ["CSS", "HTML", "Python", "C"], answer: 0 },
    { q: "Which language adds actions to a web page?", options: ["XML", "JavaScript", "JSON", "Markdown"], answer: 1 },
    { q: "Who developed Java?", options: ["Dennis Ritchie", "Guido van Rossum", "James Gosling", "Bjarne Stroustrup"], answer: 2 },
    { q: "Which method starts a Java program?", options: ["start()", "main()", "run()", "init()"], answer: 1 }
  ];

  var timeLeft = 180;   // 3 minutes = 180 seconds
  var timerId;

  // ----- PART 1: Login -----
  function login() {
    var u = document.getElementById("user").value;
    var p = document.getElementById("pass").value;

    if (u === "student1" && p === "1234") {
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("examPage").classList.remove("hidden");
      showQuestions();
      startTimer();
    } else {
      document.getElementById("error").textContent = "Wrong username or password";
    }
  }

  // ----- PART 2: Show questions with options -----
  function showQuestions() {
    var html = "";
    for (var i = 0; i < questions.length; i++) {
      html += "<p><b>" + (i + 1) + ". " + questions[i].q + "</b></p>";
      for (var j = 0; j < questions[i].options.length; j++) {
        html += "<label><input type='radio' name='q" + i + "' value='" + j + "'> " + questions[i].options[j] + "</label>";
      }
    }
    document.getElementById("questions").innerHTML = html;
  }

  // ----- PART 3: Timer -----
  function startTimer() {
    timerId = setInterval(function () {
      timeLeft = timeLeft - 1;
      var min = Math.floor(timeLeft / 60);
      var sec = timeLeft % 60;
      document.getElementById("timer").textContent = min + ":" + (sec < 10 ? "0" : "") + sec;

      if (timeLeft <= 0) {
        submitExam();   // time over, submit automatically
      }
    }, 1000);
  }

  // ----- PART 4: Submit and calculate the result -----
  function submitExam() {
    clearInterval(timerId);
    var score = 0;

    for (var i = 0; i < questions.length; i++) {
      var chosen = document.querySelector("input[name='q" + i + "']:checked");
      if (chosen && Number(chosen.value) === questions[i].answer) {
        score = score + 1;
      }
    }

    document.getElementById("examPage").classList.add("hidden");
    document.getElementById("resultPage").classList.remove("hidden");
    document.getElementById("score").textContent = "Score: " + score + " / " + questions.length;
    document.getElementById("status").textContent = score >= 3 ? "PASS" : "FAIL";
  }
</script>

</body>
</html>
